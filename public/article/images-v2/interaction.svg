<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>One meal, from choices to directions</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial" fill="#000"><text x="24" y="40" font-size="26">One meal, from choices to directions</text><rect x="24" y="75" width="912" height="82" fill="#e8e8e8"/><text x="42" y="103" font-size="20" font-weight="bold">1 · Expand breakfast</text><text x="42" y="134" font-size="17">The disclosure reveals food_options belonging to that meal.</text><rect x="24" y="175" width="912" height="82" fill="#e8e8e8"/><text x="42" y="203" font-size="20" font-weight="bold">2 · Open its map</text><text x="42" y="234" font-size="17">The link carries food=&lt;step_id&gt;, not just the selected date.</text><rect x="24" y="275" width="912" height="82" fill="#e8e8e8"/><text x="42" y="303" font-size="20" font-weight="bold">3 · Select and fit the alternatives</text><text x="42" y="334" font-size="17">dayFoodItems filters the matching meal and deduplicates names and addresses.</text><rect x="24" y="375" width="912" height="82" fill="#e8e8e8"/><text x="42" y="403" font-size="20" font-weight="bold">4 · Choose a place → Directions</text><text x="42" y="434" font-size="17">A separate Google Maps URL opens navigation to the selected destination.</text><rect x="24" y="475" width="912" height="82" fill="#e8e8e8"/><text x="42" y="503" font-size="20" font-weight="bold">5 · Choose another meal or restore the day</text><text x="42" y="534" font-size="17">The new meal replaces the focus; Show all places restores day context.</text></g></svg>