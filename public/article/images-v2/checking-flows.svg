<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" role="img" aria-label="Map booking and journal checks"><title>Map booking and journal checks</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#144FFF" stroke-width="1.5"/></marker></defs><g font-family="Arial" fill="#000"><text x="24" y="30" font-size="16" font-weight="700">CHECK THE PATH, INCLUDING WHEN IT FAILS</text><rect x="20" y="65" width="920" height="90" rx="15" fill="#D6E0FF"/><text x="38" y="97" font-size="22" font-weight="700">Map</text><text x="38" y="126" font-size="17">Open stop → load map → select the right place</text><rect x="20" y="185" width="920" height="90" rx="15" fill="#FFF0B0"/><text x="38" y="217" font-size="22" font-weight="700">Booking</text><text x="38" y="246" font-size="17">Open ticket → reach the matching original file</text><rect x="20" y="305" width="920" height="90" rx="15" fill="#FFD6DE"/><text x="38" y="337" font-size="22" font-weight="700">Journal</text><text x="38" y="366" font-size="17">Write → reload → recover draft → send → receipt</text><text x="24" y="450" font-size="22" font-weight="700">If something fails:</text><text x="24" y="485" font-size="19">Map: show Retry.  Booking: explain a missing link.  Journal: preserve the draft.</text><text x="24" y="535" font-size="18">Repeat across themes and dates, then check the actual phone separately.</text></g></svg>