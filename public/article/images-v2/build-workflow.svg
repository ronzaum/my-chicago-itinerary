<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><title>From a project question to a checked change</title><g font-family="Arial" fill="#000"><path d="M70 115H930" stroke="#144FFF" stroke-width="3"/><g fill="#144FFF"><circle cx="70" cy="115" r="10"/><circle cx="355" cy="115" r="10"/><circle cx="640" cy="115" r="10"/><circle cx="930" cy="115" r="10"/></g><g font-family="monospace" font-size="19"><text x="24" y="65">/explore</text><text x="284" y="65">/create-plan</text><text x="580" y="65">/execute</text><text x="858" y="65">check</text></g><g font-size="22" font-weight="bold"><text x="24" y="175">Trace the action</text><text x="284" y="175">Define the change</text><text x="565" y="175">Build it</text><text x="820" y="175">Try the flow</text></g><g font-size="17"><text x="24" y="211">Screen → data → service</text><text x="284" y="211">Baseline + constraints</text><text x="565" y="211">Edit maintained source</text><text x="820" y="211">Day / night / reload</text><text x="24" y="240">Find the existing behaviour</text><text x="284" y="240">Keep alternatives intact</text><text x="565" y="240">Rebuild the preview</text><text x="820" y="240">Check failures too</text></g><path d="M930 275v35H70v-35" stroke="#9E6F0B" stroke-width="2" fill="none"/><text x="500" y="348" text-anchor="middle" font-size="18">Compare → choose → record the decision → refine again</text></g></svg>