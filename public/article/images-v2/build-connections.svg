<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-label="How decisions, adapted skills, source and preview connect"><title>How decisions, adapted skills, source and preview connect</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#144FFF" stroke-width="1.5"/></marker></defs><g font-family="Arial" fill="#000"><text x="24" y="30" font-size="16" font-weight="700">FROM MY DECISION TO THE SCREEN</text><rect x="20" y="65" width="280" height="85" rx="15" fill="#D6E0FF"/><text x="38" y="97" font-size="22" font-weight="700">My brief + saved choices</text><text x="38" y="126" font-size="17">Layout, palette, behaviour</text><path d="M300 107H340" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="65" width="270" height="85" rx="15" fill="#D6E0FF"/><text x="368" y="97" font-size="22" font-weight="700">Adapted project skills</text><text x="368" y="126" font-size="17">Explore → plan → execute</text><path d="M620 107H660" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="65" width="270" height="85" rx="15" fill="#FFF0B0"/><text x="688" y="97" font-size="22" font-weight="700">Maintained source</text><text x="688" y="126" font-size="17">HTML + CSS + JavaScript</text><path d="M805 150V205H490V245" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="250" width="590" height="85" rx="15" fill="#FFF0B0"/><text x="368" y="282" font-size="22" font-weight="700">Build → local preview</text><text x="368" y="311" font-size="17">Trip data + interface code become the page I can try.</text><path d="M490 335V380" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="385" width="590" height="85" rx="15" fill="#FFD6DE"/><text x="368" y="417" font-size="22" font-weight="700">Compare and test the complete action</text><text x="368" y="446" font-size="17">Day / night · different days · narrow screens · reload</text><path d="M350 425H12V180H160V150" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="300" font-size="19" font-weight="700">Revise the decision</text><text x="24" y="328" font-size="17">Keep the alternatives.</text><text x="24" y="354" font-size="17">Record what I chose.</text><text x="24" y="520" font-size="18">Some skills originated with Zevi Arnovitz; I edited them for my project.</text></g></svg>