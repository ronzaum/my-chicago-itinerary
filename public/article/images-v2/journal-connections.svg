<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" role="img" aria-label="Journal draft, send, receipt and retry flow"><title>Journal draft, send, receipt and retry flow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#144FFF" stroke-width="1.5"/></marker></defs><g font-family="Arial" fill="#000"><text x="24" y="30" font-size="16" font-weight="700">WHAT “SAVED” MEANS</text><rect x="20" y="65" width="250" height="85" rx="15" fill="#D6E0FF"/><text x="38" y="97" font-size="22" font-weight="700">I write</text><text x="38" y="126" font-size="17">A recoverable device draft</text><path d="M270 107H320" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="65" width="260" height="85" rx="15" fill="#D6E0FF"/><text x="348" y="97" font-size="22" font-weight="700">I press Send</text><text x="348" y="126" font-size="17">Keep the same entry ID</text><path d="M590 107H640" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="65" width="290" height="85" rx="15" fill="#FFF0B0"/><text x="668" y="97" font-size="22" font-weight="700">Private journal service</text><text x="668" y="126" font-size="17">Validate and store the entry</text><path d="M795 150V205H460V250" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="255" width="610" height="85" rx="15" fill="#FFF0B0"/><text x="348" y="287" font-size="22" font-weight="700">Receipt received → clear the draft</text><text x="348" y="316" font-size="17">Submitted reflections stay sealed until manually released.</text><path d="M650 125H620V400H145V150" fill="none" stroke="#144FFF" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="388" font-size="18" font-weight="700">No receipt? Keep the words available and retry.</text><rect x="20" y="455" width="920" height="85" rx="15" fill="#FFD6DE"/><text x="38" y="487" font-size="22" font-weight="700">Public demo: a simpler, separate path</text><text x="38" y="516" font-size="17">Write → local browser storage. No location collection or private journal server.</text></g></svg>