<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img"><title>What connects to what</title><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial" fill="#000"><text x="24" y="40" font-size="26">What connects to what</text><rect x="24" y="75" width="912" height="82" fill="#e8e8e8"/><text x="42" y="103" font-size="20" font-weight="bold">Browser → generated trip data</text><text x="42" y="134" font-size="17">Itinerary, shared date/theme, choices, original-document actions.</text><rect x="24" y="175" width="912" height="82" fill="#e8e8e8"/><text x="42" y="203" font-size="20" font-weight="bold">Browser → /api/map-config → Google Maps</text><text x="42" y="234" font-size="17">Authenticated configuration; browser API loads tiles and place details.</text><rect x="24" y="275" width="912" height="82" fill="#e8e8e8"/><text x="42" y="303" font-size="20" font-weight="bold">Directions / document actions → external websites</text><text x="42" y="334" font-size="17">Google Maps navigation and iCloud file/folder links. No iCloud API.</text><rect x="24" y="375" width="912" height="82" fill="#e8e8e8"/><text x="42" y="403" font-size="20" font-weight="bold">Journal typing → device draft</text><text x="42" y="434" font-size="17">Verified-owner namespace + stable entry ID; tab fallback if needed.</text><rect x="24" y="475" width="912" height="82" fill="#e8e8e8"/><text x="42" y="503" font-size="20" font-weight="bold">Send → worker → DB → receipt</text><text x="42" y="534" font-size="17">Identity and input checks; duplicate-safe save; draft clears after receipt.</text><rect x="24" y="575" width="912" height="82" fill="#e8e8e8"/><text x="42" y="603" font-size="20" font-weight="bold">Journal reading → manual server gate</text><text x="42" y="634" font-size="17">Submitted reflections remain sealed. No automatic post-trip reveal.</text></g></svg>